<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valence</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="brand">Valence <span>arbitrage screener</span></div>
    <div class="mono" id="whoami" style="color:var(--muted);font-size:.85rem"></div>
  </header>

  <div class="wrap cols">
    <!-- Screen 1: launch form -->
    <div class="panel">
      <h2>Launch a scan</h2>

      <div class="usage" title="Actual Anthropic API calls this month (cache misses only)">
        <span class="num" id="usage-num">–</span>
        <span class="lbl">LLM calls<br>month-to-date</span>
      </div>

      <label for="type">Job type</label>
      <select id="type">
        <option value="scan">scan — python -m arb</option>
        <option value="max">max — python -m arb.max (exhaustive, one section)</option>
      </select>

      <!-- scan fields -->
      <div class="fields" data-for="scan">
        <label for="sections">Sections <span class="field-note">(comma list; blank = all)</span></label>
        <input id="sections" placeholder="crypto,politics">
        <label for="per_section">Per-section market cap <span class="field-note">(optional)</span></label>
        <input id="per_section" type="number" min="1" placeholder="default">
        <label for="min_profit">Min profit / contract ($)</label>
        <input id="min_profit" type="number" step="0.001" placeholder="0">
      </div>

      <!-- max fields -->
      <div class="fields" data-for="max" style="display:none">
        <label for="section">Section <span class="field-note">(required, exactly one)</span></label>
        <select id="section">
          <option value="politics">politics</option>
          <option value="sports">sports</option>
          <option value="crypto">crypto</option>
          <option value="finance">finance</option>
          <option value="tech">tech</option>
          <option value="culture">culture</option>
        </select>
        <label for="min_volume">Min market volume ($) <span class="field-note">(drops dust before matching; floor $1, lower = wider &amp; slower)</span></label>
        <input id="min_volume" type="number" min="1" step="1" placeholder="default 10000">
      </div>

      <!-- shared fields -->
      <label for="size">Order size (contracts)</label>
      <input id="size" type="number" min="1" placeholder="1">

      <label for="max_validations">Max LLM validations <span class="field-note" id="mv-note"></span></label>
      <input id="max_validations" type="number" min="0" placeholder="default 15">

      <div class="check">
        <input type="checkbox" id="no_llm">
        <label for="no_llm">Skip LLM validation (<span class="mono">--no-llm</span>, no API spend)</label>
      </div>

      <div class="max-warn" id="max-warn">
        <b>max</b> fetches an entire section and validates <b>every</b> matched
        pair. LLM calls are <b>uncapped by default</b> — set a
        <b>Max LLM validations</b> cap (or check <span class="mono">--no-llm</span>)
        before launching to bound cost.
      </div>

      <button class="launch-btn" id="launch">Launch</button>
      <div class="msg" id="msg"></div>
    </div>

    <!-- Screen 2: run list -->
    <div class="panel">
      <h2>Runs</h2>
      <div id="runlist"><div class="empty">loading…</div></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
